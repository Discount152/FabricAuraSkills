name: GraniteSkills
version: ${projectVersion}
main: dev.granite.graniteskills.bukkit.GraniteSkills
description: The ultra-versatile RPG skills plugin
author: Granite Skills
website: https://github.com/Discount152/FabricAuraSkills
softdepend:
- WorldGuard
- PlaceholderAPI
- HolographicDisplays
- DecentHolograms
- Vault
- ProtocolLib
- LuckPerms
- Slimefun
- Towny
- MythicMobs
- FancyHolograms
api-version: '1.13'
folia-supported: true
prefix: GraniteSkills

permissions:
  graniteskills.*:
    description: Permission to use all commands from GraniteSkills
    children:
      graniteskills.command.user: true
      graniteskills.skill.*: true
      graniteskills.command.admin: true
    default: false

  graniteskills.command.user:
    description: Permissions users have by default
    children:
      graniteskills.command.skills: true
      graniteskills.command.stats: true
      graniteskills.command.sources: true
      graniteskills.command.help: true
      graniteskills.command.mana: true
      graniteskills.command.top: true
      graniteskills.command.rank: true
      graniteskills.command.lang: true
      graniteskills.command.abtoggle: true
      graniteskills.command.claimitems: true
    default: true

  graniteskills.skill.*:
    description: Permission to use all skills
    children:
      graniteskills.skill.farming: true
      graniteskills.skill.foraging: true
      graniteskills.skill.mining: true
      graniteskills.skill.fishing: true
      graniteskills.skill.excavation: true
      graniteskills.skill.archery: true
      graniteskills.skill.defense: true
      graniteskills.skill.fighting: true
      graniteskills.skill.endurance: true
      graniteskills.skill.agility: true
      graniteskills.skill.alchemy: true
      graniteskills.skill.enchanting: true
      graniteskills.skill.sorcery: true
      graniteskills.skill.healing: true
      graniteskills.skill.forging: true
    default: true

  graniteskills.command.item.*:
    description: All permissions related to the creation of items using GraniteSkills modifiers
    children:
      graniteskills.command.item.modifier: true
      graniteskills.command.item.requirement: true
      graniteskills.command.item.multiplier: true
      graniteskills.command.item.register: true
      graniteskills.command.item.give: true
      graniteskills.command.item.ignore: true
    default: false

  graniteskills.command.armor.*:
    description: All permissions related to the creation of armors using GraniteSkills modifiers
    children:
      graniteskills.command.armor.modifier: true
      graniteskills.command.armor.requirement: true
      graniteskills.command.armor.multiplier: true
    default: false

  graniteskills.command.admin:
    description: Permission to use all admin/op commands
    children:
      graniteskills.command.item.*: true
      graniteskills.command.armor.*: true
      graniteskills.command.save: true
      graniteskills.command.version: true
      graniteskills.command.multiplier: true
      graniteskills.command.updateleaderboards: true
      graniteskills.command.transfer: true
      graniteskills.command.mana.add: true
      graniteskills.command.mana.remove: true
      graniteskills.command.mana.set: true
      graniteskills.command.mana.other: true
      graniteskills.command.reload: true
      graniteskills.command.backup.save: true
      graniteskills.command.backup.load: true
      graniteskills.command.skill.setlevel: true
      graniteskills.command.skill.reset: true
      graniteskills.command.xp.add: true
      graniteskills.command.xp.set: true
      graniteskills.command.xp.remove: true
      graniteskills.command.preset: true
      graniteskills.command.profile: true
      graniteskills.command.modifier: true
      graniteskills.command.storage: true
      graniteskills.command.openmenu: true
      graniteskills.command.manaability.resetcooldown: true
      graniteskills.command.jobs: true
      graniteskills.command.jobs.other: true
      graniteskills.command.antiafk.logs: true
      graniteskills.multiplier: true
      graniteskills.checkupdates: true
      graniteskills.jobs.limit: true
      graniteskills.jobs.block: true
      graniteskills.antiafk.notify: true
    default: false

  graniteskills.command.skills:
    default: false
  graniteskills.command.stats:
    default: false
  graniteskills.command.sources:
    default: false
  graniteskills.command.help:
    default: false
  graniteskills.command.mana:
    default: false
  graniteskills.command.top:
    default: false
  graniteskills.command.rank:
    default: false
  graniteskills.command.lang:
    default: false
  graniteskills.command.abtoggle:
    default: false
  graniteskills.command.save:
    default: op
