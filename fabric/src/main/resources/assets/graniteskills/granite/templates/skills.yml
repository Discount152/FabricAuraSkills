# Granite Skills — 6×9 chest; utilities on rows 1 and 6.
# Every enabled skill fills the skill slots in order (farming … forging). The slot list must have at least
# as many entries as enabled skills, otherwise the built-in menu is used.
id: skills
title: "§8§lYour Skills"
rows: 6

items:
  skill:
    material: minecraft:stone
    slots:
      - 11
      - 12
      - 13
      - 14
      - 15
      - 20
      - 21
      - 22
      - 23
      - 24
      - 29
      - 30
      - 31
      - 32
      - 33
    name: "§f{skill_display}"
    lore:
      - "§7Level §f{skill_level} §8· §7XP §f{skill_xp}"
      - "§8({skill_xp_in_level} in this level)"
      - ""
      - "§a▸ §7Levels"
    action: skill_row

  leaderboard:
    material: minecraft:gold_ingot
    slot: 0
    name: "§6Leaderboard"
    lore:
      - "§7Power leaderboard"
    action: open_leaderboard

  stats_button:
    material: minecraft:player_head
    slot: 8
    name: "§bYour Stats"
    lore:
      - "§7Open your stats"
    action: open_stats

  unclaimed:
    material: minecraft:chest_minecart
    slot: 45
    name: "§eUnclaimed Items"
    lore:
      - "§7Claim pending rewards"
    action: open_unclaimed_items

  close:
    material: minecraft:barrier
    slot: 53
    name: "§cClose"
    lore:
      - "§7Exit"
    action: close
