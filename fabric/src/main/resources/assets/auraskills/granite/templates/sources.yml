# Sprint 98 — bundled v0 template for sources (GraniteLib YAML schema v0).
# Grid slots match built-in FabricSourcesMenuGui (7×4, 28 cells). Fallback: built-in menu on any failure.
id: sources
title: "Sources: {skill_display} — {sort}"
rows: 6

fill:
  material: minecraft:black_stained_glass_pane
  name: " "

items:
  source:
    material: minecraft:gray_dye
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    name: "{source_name}"
    lore:
      - "XP: {source_xp}"
      - "Skill: {skill_display}"
      - "Type: {source_type}"
    action: source_row
  back:
    material: minecraft:arrow
    slot: 45
    name: "Back"
    lore:
      - "Return to level progression"
    action: back
  previous:
    material: minecraft:arrow
    slot: 48
    name: "Previous Page"
    action: previous_page
  sort:
    material: minecraft:hopper
    slot: 49
    name: "Sort: {sort}"
    lore:
      - "Click to change sorting"
    action: cycle_sort
  next:
    material: minecraft:arrow
    slot: 50
    name: "Next Page"
    action: next_page
