# Sprint 102 — bundled v0 template for abilities (GraniteLib YAML schema v0).
# Passive slots match built-in FabricAbilitiesMenuGui order (14 cells). Mana uses a fixed slot (31) — built-in
# places mana immediately after passives; template uses explicit layout (see manual).
# Fallback: built-in FabricAbilitiesMenuGui on any failure.
id: abilities
title: "{skill_display} Abilities"
rows: 6

fill:
  material: minecraft:black_stained_glass_pane
  name: " "

items:
  ability:
    material: minecraft:book
    slots:
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 17
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 26
    name: "{ability_display}"
    lore:
      - "Level required / progress: {ability_unlock_level}"
      - "Status: {ability_status}"
      - "{ability_description}"
    action: ability_row

  mana_ability:
    material: minecraft:nether_star
    slot: 31
    name: "{mana_ability_display}"
    lore:
      - "Status: {mana_ability_status}"
      - "{mana_ability_description}"
    action: mana_ability_row

  back:
    material: minecraft:arrow
    slot: 45
    name: "Back"
    lore:
      - "Return to level progression"
    action: back
