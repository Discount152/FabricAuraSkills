# Sprint 101 — bundled v0 template for stats list (GraniteLib YAML schema v0).
# 28-slot grid matches sources. Paging slots match built-in defaults (45 / 53).
# Stat row clicks open stat_info only when menus.stat_info.enabled (same as built-in).
# Fallback: built-in FabricStatsMenuGui on any failure.
id: stats
title: "Stats"
rows: 6

fill:
  material: minecraft:black_stained_glass_pane
  name: " "

items:
  stat:
    material: minecraft:book
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    name: "{stat_display}"
    lore:
      - "{stat_description}"
      - "Value: {stat_value}"
      - "Click for details"
    action: stat_row
  previous:
    material: minecraft:arrow
    slot: 45
    name: "Previous Page"
    action: previous_page
  next:
    material: minecraft:arrow
    slot: 53
    name: "Next Page"
    action: next_page
