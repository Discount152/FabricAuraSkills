# Granite Skills — leaderboard (template v0). Entries stay paper-like; use framed title and clear controls.
# Fallback: built-in FabricLeaderboardMenuGui on any failure.
id: leaderboard
title: "§6§l{leaderboard_title}"
rows: 6

fill:
  material: minecraft:gray_stained_glass_pane
  name: " "

items:
  entry:
    material: minecraft:gold_nugget
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 9
      - 10
      - 11
      - 12
      - 13
    name: "§e#{rank} §f{player}"
    lore:
      - "§7Score: §f{value}"
      - "§8({leaderboard_type})"
    action: leaderboard_row
  back:
    material: minecraft:iron_door
    slot: 45
    name: "§c← Skills"
    lore:
      - "§7Close leaderboard"
    action: back
  previous:
    material: minecraft:arrow
    slot: 48
    name: "§e« Page"
    lore:
      - "§7Previous ranks"
    action: previous_page
  refresh:
    material: minecraft:compass
    slot: 49
    name: "§bRefresh"
    lore:
      - "§7Reload rankings from disk"
    action: refresh
  next:
    material: minecraft:arrow
    slot: 50
    name: "§ePage »"
    lore:
      - "§7Next ranks"
    action: next_page
