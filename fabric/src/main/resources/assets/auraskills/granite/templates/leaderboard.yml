# Granite Skills — leaderboard template.
# Sprint 119: inventory title from Java (FabricMenuTitles#fromLeaderboardContextLine); YAML `title` is ignored at runtime.
# Sprint 120: no global filler panes; entry rows use paper (see built-in FabricLeaderboardMenuGui for parity); back = iron_door.
id: leaderboard
title: "{leaderboard_title}"
rows: 6

items:
  entry:
    material: minecraft:paper
    slots:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 9
      - 10
      - 11
      - 12
      - 13
    name: "#{rank} {player}"
    lore:
      - "Score: {value}"
      - "{leaderboard_type}"
    action: leaderboard_row
  back:
    material: minecraft:iron_door
    slot: 45
    name: "+ Skills"
    lore:
      - "Back to your skills"
    action: back
  previous:
    material: minecraft:arrow
    slot: 48
    name: "Previous page"
    lore:
      - "Previous ranks"
    action: previous_page
  refresh:
    material: minecraft:compass
    slot: 49
    name: "Refresh"
    lore:
      - "Reload rankings from cache"
    action: refresh
  next:
    material: minecraft:arrow
    slot: 50
    name: "Next page"
    lore:
      - "Next ranks"
    action: next_page
