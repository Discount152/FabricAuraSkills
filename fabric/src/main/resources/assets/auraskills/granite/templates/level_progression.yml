# Sprint 100 — bundled v0 template for level_progression (GraniteLib YAML schema v0).
# Level grid slots match 7×4 (28 cells) used by sources. Fallback: built-in FabricLevelProgressionMenuGui on any failure.
id: level_progression
title: "{skill_display} Levels"
rows: 6

fill:
  material: minecraft:black_stained_glass_pane
  name: " "

items:
  level:
    material: minecraft:lime_dye
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    name: "Level {level}"
    lore:
      - "Status: {level_status}"
      - "XP required: {level_xp_required}"
      - "Current XP: {current_xp}"
    action: level_row
  sources:
    material: minecraft:hopper
    slot: 50
    name: "Sources"
    lore:
      - "View XP sources"
    action: open_sources
  abilities:
    material: minecraft:nether_star
    slot: 51
    name: "Abilities"
    lore:
      - "View abilities"
    action: open_abilities
  back:
    material: minecraft:arrow
    slot: 45
    name: "Back"
    lore:
      - "Return to skills"
    action: back
  previous:
    material: minecraft:arrow
    slot: 48
    name: "Previous Page"
    action: previous_page
  next:
    material: minecraft:arrow
    slot: 49
    name: "Next Page"
    action: next_page
