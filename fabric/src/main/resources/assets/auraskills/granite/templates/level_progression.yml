# Granite Skills — level progression (template). Row materials overridden in Java:
# completed = lime dye, current = experience bottle, locked = gray dye (Sprint 116).
# Fallback: built-in FabricLevelProgressionMenuGui on any failure.
id: level_progression
title: "<gold><bold>{skill_display}</bold></gold> <gray>Levels</gray>"
rows: 6

fill:
  material: minecraft:glass_pane
  name: " "

items:
  level:
    material: minecraft:lime_dye
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    name: "<white>Level </white><yellow>{level}</yellow>"
    lore:
      - "{level_status}"
      - ""
      - "{level_detail}"
    action: level_row
  sources:
    material: minecraft:knowledge_book
    slot: 50
    name: "<aqua>Sources</aqua>"
    lore:
      - "<gray>XP sources for this skill</gray>"
    action: open_sources
  abilities:
    material: minecraft:amethyst_shard
    slot: 51
    name: "<light_purple>Abilities</light_purple>"
    lore:
      - "<gray>Passives and mana abilities</gray>"
    action: open_abilities
  back:
    material: minecraft:arrow
    slot: 45
    name: "<white>Back</white>"
    lore:
      - "<gray>Return to Skills</gray>"
    action: back
  previous:
    material: minecraft:arrow
    slot: 48
    name: "<yellow>Previous</yellow>"
    lore:
      - "<gray>Previous page</gray>"
    action: previous_page
  next:
    material: minecraft:arrow
    slot: 49
    name: "<yellow>Next</yellow>"
    lore:
      - "<gray>Next page</gray>"
    action: next_page
