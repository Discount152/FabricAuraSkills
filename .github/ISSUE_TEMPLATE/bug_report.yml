name: Bug Report
description: Report bugs and issues
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting a bug, please make sure you are on the latest version of GraniteSkills.
  - type: input
    id: server-version
    attributes:
      label: Server software and version
      description: |
        The type of server software and Minecraft version you are running.
        Example: Paper 1.17.1
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A detailed description of the bug or issue, including expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: A detailed list of steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional information
      description: |
        Any additional information that explains the problem or might be helpful to fixing the issue (optional).
        This could include links to screenshots, videos, etc.
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Agreements
      description: Before submitting, please agree to the following.
      options:
        - label: I am running the latest version of GraniteSkills
          required: true
        - label: I am not using an unsupported server software (https://github.com/Discount152/FabricAuraSkills/tree/main/wiki/incompatibilities)
          required: true
        - label: My version of Minecraft is supported by GraniteSkills
          required: true