name: Build Plugin with Gradle
on:
  push:
    branches: [ "master" ]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: "25"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Build GraniteLib
        # Gameplay :fabric is still Yarn 1.21.11 and will not compile against GraniteLib 0.2 / MC 26.3
        # until that port lands. This job builds the library the port consumes.
        run: ./gradlew -PfabricOnly=true :granitelib-fabric:build --refresh-dependencies
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: granitelib-fabric
          path: slate-fabric/build/libs/granitelib-fabric-*.jar
      - name: Delete all summary content
        run: rm $GITHUB_STEP_SUMMARY
